<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PXEngine — Screens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15161A;--ink2:#4C4F57;--ink3:#83878F;--line:#E1E2E6;--line2:#EFF0F2;
--bg:#FCFCFD;--gold:#8A6D1F;--goldbg:#FBF6E8;--goldline:#E3D5AB;--mark:#FCC311}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:26px 34px 70px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;
padding-bottom:16px;border-bottom:2px solid var(--ink)}
.logo{height:23px;width:auto;display:block;margin-bottom:10px}
h1{font-size:29px;font-weight:600;letter-spacing:-.022em;line-height:1.08}
.sub{font-size:15.5px;color:var(--ink2);margin-top:5px;max-width:720px}
.filters{display:flex;gap:7px;flex:none}
.filters button{font:inherit;font-size:14px;font-weight:600;padding:8px 17px;border-radius:100px;
border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;white-space:nowrap}
.filters button:hover{border-color:var(--ink3);color:var(--ink)}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h2{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--gold);
font-weight:700;margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
figure{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
figure:hover{border-color:var(--gold)}
figure img{width:100%;display:block;border-bottom:1px solid var(--line2);cursor:zoom-in}
figcaption{padding:12px 15px 14px}
.cn{display:flex;align-items:baseline;gap:9px}
.cn b{font-size:15.5px;font-weight:600}
.num{font-size:12.5px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;
flex:none}
.tag{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--gold);
background:var(--goldbg);border:1px solid var(--goldline);border-radius:4px;padding:1px 7px;
white-space:nowrap}
/* callout key */
.key{list-style:none;counter-reset:k;margin-top:9px;padding-top:9px;
border-top:1px solid var(--line2)}
.key li{counter-increment:k;position:relative;padding-left:25px;font-size:13px;
color:var(--ink2);margin-bottom:5px;line-height:1.42}
.key li::before{content:counter(k);position:absolute;left:0;top:1px;width:17px;height:17px;
border-radius:50%;background:var(--goldbg);border:1px solid var(--goldline);color:var(--gold);
font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.key li b{color:var(--ink);font-weight:600}
.cf{font-size:12px;color:var(--ink3);margin-top:9px;padding-top:8px;
border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
.hide{display:none}
/* viewer */
#v{position:fixed;inset:0;background:rgba(12,12,14,.95);display:none;z-index:50;
padding:20px 24px}
#v.on{display:grid;grid-template-rows:auto 1fr;gap:14px}
#vh{display:flex;align-items:baseline;gap:14px;color:#EDEAE3}
#vh b{font-size:20px;font-weight:600}
#vn{font-size:14px;color:#9A968F;font-variant-numeric:tabular-nums}
#vx{margin-left:auto;font:inherit;font-size:14px;font-weight:600;color:#EDEAE3;
background:none;border:1px solid #3A3A3E;border-radius:100px;padding:6px 16px;cursor:pointer}
#vx:hover{background:#26262B}
#vb{display:grid;grid-template-columns:1fr 372px;gap:22px;min-height:0}
#vi{display:flex;align-items:center;justify-content:center;min-height:0}
#vi img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#vp{overflow-y:auto;color:#A8A39B;font-size:14px;padding-right:6px}
#vp .lbl{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#78746E;
font-weight:700;margin-bottom:6px}
#vp .act{color:#EDEAE3;font-size:14.5px;margin-bottom:18px}
#vp .act b{font-weight:600}
#vp ol{list-style:none;counter-reset:v;margin-bottom:18px}
#vp ol li{counter-increment:v;position:relative;padding-left:29px;margin-bottom:9px;
line-height:1.45}
#vp ol li::before{content:counter(v);position:absolute;left:0;top:1px;width:20px;height:20px;
border-radius:50%;background:#CBB78A;color:#15161A;font-size:11.5px;font-weight:700;
display:flex;align-items:center;justify-content:center}
#vp ol li b{color:#EDEAE3;font-weight:600}
#vp .note{border:1px solid #4A422F;background:#1C1913;border-radius:7px;padding:10px 12px;
color:#CBB78A;font-size:13px;margin-bottom:18px}
#vp .note b{color:#EDEAE3}
#vp .ids{font-size:12.5px;color:#78746E;font-variant-numeric:tabular-nums;
padding-top:12px;border-top:1px solid #2A2A2E}
#vf{color:#5F5C57;font-size:12.5px;text-align:center;grid-column:1/-1}
kbd{font-family:inherit;font-size:11.5px;font-weight:600;background:#26262B;
border:1px solid #3A3A3E;border-radius:4px;padding:1px 6px;color:#A8A39B}
@media (max-width:1250px){.grid{grid-template-columns:repeat(2,1fr)}
 #vb{grid-template-columns:1fr 300px}}
</style></head><body><div class="wrap">

</header><h2 data-g="0">Entry</h2><div class="grid" data-g="0"><figure data-n="1" data-cut="1">
 <img src="figures/fig-3-01.png" alt="Home screen" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.1</span><b>Home screen</b><span class="tag">CUT 1/7</span></div>
  <ol class="key"><li>Six featured agents, each tagged with a category (Research, Marketing, Workflow), a complexity level, and the output it produces — report, slides or data table.</li><li><b>View all agents</b> opens the full template picker.</li><li>A free-text field accepts a request without selecting a template.</li></ol>
  <div class="cf">F01 · F04</div>
 </figcaption></figure><figure data-n="2" data-cut="0">
 <img src="figures/fig-3-02.png" alt="Template picker" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.2</span><b>Template picker</b></div>
  <ol class="key"><li>Approximately 20 prebuilt workstreams.</li><li><b>Start from Scratch</b> is the first card and accepts a plain-language description.</li><li>The model dropdown at the lower left of the modal sets the model for the workstream. It lists only models the organisation has approved.</li><li>Each template states the output it produces.</li></ol>
  <div class="cf">F02 · F03 · F05</div>
 </figcaption></figure></div><h2 data-g="1">Report generation</h2><div class="grid" data-g="1"><figure data-n="3" data-cut="1">
 <img src="figures/fig-3-03.png" alt="Data-availability check" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.3</span><b>Data-availability check</b><span class="tag">CUT 2/7</span></div>
  <ol class="key"><li>The agent queried the available date range before answering. The dataset runs 2024-09-04 to 2026-06-22.</li><li>It reported: &ldquo;July 2026 data is not yet available. Let me generate the June 2026 monthly report instead, which is the most recent complete month.&rdquo;</li><li>Channel-level figures follow, returned from BigQuery.</li></ol>
  <div class="cf">F10 · F11 · F15</div>
 </figcaption></figure><figure data-n="4" data-cut="0">
 <img src="figures/fig-3-04.png" alt="Tables and charts" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.4</span><b>Tables and charts</b></div>
  <ol class="key"><li>Data tables support 10, 25 or 50 rows per page, with paging.</li><li>Charts are rendered from configuration written by the agent, with value labels and axis formatting.</li></ol>
  <div class="cf">F12 · F13</div>
 </figcaption></figure><figure data-n="5" data-cut="1">
 <img src="figures/fig-3-05.png" alt="Report outline gate" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.5</span><b>Report outline gate</b><span class="tag">CUT 3/7</span></div>
  <ol class="key"><li>Each proposed finding is an editable text field.</li><li>A checkbox on each row includes or excludes that finding.</li><li>Up and down arrows set the order.</li><li><b>Approve &amp; Build</b> commits the outline and starts generation. No rendering occurs before it is pressed.</li></ol>
  <div class="cf">F19 · F20 · F21 · F22 · F23</div>
 </figcaption></figure><figure data-n="6" data-cut="1">
 <img src="figures/fig-3-06.png" alt="Generated report" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.6</span><b>Generated report</b><span class="tag">CUT 4/7</span></div>
  <ol class="key"><li>Header metadata: Comprehensive &middot; 10 Sections &middot; 2.9k Words &middot; Market Analysis.</li><li>The branded header is applied at render time from <b>Organization &rarr; Design</b>, not stored in the report.</li><li>Controls: edit, fullscreen, copy link, download.</li></ol>
  <div class="cf">F24 · F25 · F26 · F28 · F29</div>
 </figcaption></figure></div><h2 data-g="2">Presentation generation</h2><div class="grid" data-g="2"><figure data-n="7" data-cut="0">
 <img src="figures/fig-3-07.png" alt="Deck card" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.7</span><b>Deck card</b></div>
  <ol class="key"><li><b>12 slides &middot; Brand</b> states the slide count and the brand applied.</li><li>The pencil icon opens the three-pane editor.</li><li>Slides can be paged through on the card without opening the editor.</li></ol>
  <div class="cf">F33 · F44 · F46 · F47</div>
 </figcaption></figure><figure data-n="8" data-cut="1">
 <img src="figures/fig-3-08.png" alt="Deck outline gate" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.8</span><b>Deck outline gate</b><span class="tag">CUT 5/7</span></div>
  <ol class="key"><li>Every row carries a slide type: TITLE, STATS, CHART, COMPARISON, STATEMENT, GRID, CTA.</li><li><b>Deck default</b> is a per-row dropdown that overrides the theme for that slide only.</li><li>Rows can be included, excluded and reordered, as on the report outline.</li><li><b>Approve &amp; Build</b> starts the render.</li></ol>
  <div class="cf">F30 · F31 · F32</div>
 </figcaption></figure><figure data-n="9" data-cut="0">
 <img src="figures/fig-3-09.png" alt="Deck editor" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.9</span><b>Deck editor</b></div>
  <ol class="key"><li>Filmstrip on the left, slide canvas in the centre, format and outline panels on the right.</li><li>Slide 3 carries a lock badge, indicating it is pinned and excluded from regeneration.</li><li>Each outline row shows its slide type. The reference deck has 12 slides across seven types. <b>+ Add slide</b> lists all 20 available types.</li><li>Each row has a padlock, a delete control and a drag handle.</li><li>Orientation is set in the FORMAT panel.</li></ol>
  <div class="cf">F33 · F34 · F35 · F36 · F39 · F40 · F42 · F43 · F45</div>
 </figcaption></figure><figure data-n="10" data-cut="1">
 <img src="figures/fig-3-10.png" alt="Format defaults" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.10</span><b>Format defaults</b><span class="tag">CUT 6/7</span></div>
  <ol class="key"><li><b>Lock as default for all future presentations</b> promotes this deck&rsquo;s format to the standing default for subsequent runs.</li><li><b>Approve format</b> commits the layout.</li></ol>
  <div class="cf">F36 · F37 · F38</div>
 </figcaption></figure><figure data-n="11" data-cut="0">
 <img src="figures/fig-3-11.png" alt="Themes and brand" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.11</span><b>Themes and brand</b></div>
  <ol class="key"><li>Five built-in themes.</li><li><b>Activate</b> re-skins output that has already been generated. The source data is not re-queried and the text is not regenerated.</li><li>A custom extracted brand design is retained while a built-in theme is active. Deactivating restores it.</li></ol>
  <div class="cf">F48 · F49 · F50 · F52 · F54</div>
 </figcaption></figure></div><h2 data-g="3">Validation</h2><div class="grid" data-g="3"><figure data-n="12" data-cut="1">
 <img src="figures/fig-3-12.png" alt="Self-healing tab" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.12</span><b>Self-healing tab</b><span class="tag">CUT 7/7</span></div>
  <ol class="key"><li>Workflow status: one validated, one needs review, one healthy.</li><li>Configuration is checked separately from behaviour. A browser test runs while the tab is open.</li><li>Three issues are reported as NO FIX FOUND &mdash; ESCALATION REQUIRED.</li><li>Each unresolved issue offers Retry, Flag and Skip.</li></ol>
  <div class="cf">F66 · F67 · F68 · F69 · F70 · F77 · F79 · F80 · F81</div>
 </figcaption></figure><figure data-n="13" data-cut="0">
 <img src="figures/fig-3-13.png" alt="Browser sessions" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.13</span><b>Browser sessions</b></div>
  <ol class="key"><li>Two sessions are listed. The badge reads RUNNING while a test is in progress.</li><li>The test scenario is generated by the system and displayed: &ldquo;Can you generate the monthly report for our BigQuery analytics data?&rdquo;</li><li>A video recording of each session plays inline or in a new tab.</li><li><b>View chat</b> opens the full transcript of the test run.</li></ol>
  <div class="cf">F70 · F71 · F72 · F73</div>
 </figcaption></figure><figure data-n="14" data-cut="0">
 <img src="figures/fig-3-14.png" alt="Applied fixes" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.14</span><b>Applied fixes</b></div>
  <ol class="key"><li>Three issues were resolved automatically on earlier runs.</li><li>Each carries a <b>Fixed by AI</b> badge.</li><li>The applied change is shown in full: &ldquo;Strengthen base_instruction to mandate rendering the analytics-chart component after every chart generation.&rdquo;</li><li><b>View raw JSON</b> shows the complete change record.</li></ol>
  <div class="cf">F74 · F75 · F76 · F78</div>
 </figcaption></figure></div><h2 data-g="4">Administration</h2><div class="grid" data-g="4"><figure data-n="15" data-cut="0">
 <img src="figures/fig-3-15.png" alt="Usage and performance" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.15</span><b>Usage and performance</b></div>
  <ol class="key"><li>6.8M tokens across 25 sessions and 112 messages.</li><li>57.2s average response latency; 0.0% error rate.</li><li>$21.97 estimated cost, broken down by model.</li></ol>
  <div class="cf">F87 · F88</div>
 </figcaption></figure><figure data-n="16" data-cut="0">
 <img src="figures/fig-3-16.png" alt="Workstream access" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.16</span><b>Workstream access</b></div>
  <ol class="key"><li>&ldquo;Only people you share with can open this workstream.&rdquo;</li><li><b>With access: 1.</b></li><li>Access is granted individually through <b>Give access</b>.</li></ol>
  <div class="cf">F57 · F58 · F59</div>
 </figcaption></figure><figure data-n="17" data-cut="0">
 <img src="figures/fig-3-17.png" alt="Members and roles" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.17</span><b>Members and roles</b></div>
  <ol class="key"><li>Eight members in the organisation.</li><li>Role is a per-person dropdown: Owner, Admin, Member.</li><li>A <b>Pending</b> badge marks an invitation that has not been accepted.</li><li><b>Invite Member</b> adds a person by email address.</li></ol>
  <div class="cf">F61 · F62 · F63 · F64 · F65</div>
 </figcaption></figure><figure data-n="18" data-cut="0">
 <img src="figures/fig-3-18.png" alt="Model approval" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.18</span><b>Model approval</b></div>
  <ol class="key"><li>Four of seven models in the catalog are approved.</li><li>Approved models populate the workstream model dropdown shown at step 2.</li><li>Unapproved models are not selectable. A prompt requesting one is refused; no substitution is made.</li></ol>
  <div class="cf">F86</div>
 </figcaption></figure><figure data-n="19" data-cut="0">
 <img src="figures/fig-3-19.png" alt="Tool library" loading="lazy">
 <figcaption>
  <div class="cn"><span class="num">3.19</span><b>Tool library</b></div>
  <ol class="key"><li>Twenty-three tools across seven categories.</li><li>A tool added here applies to every workstream in the organisation.</li><li><b>api_connector_tool</b> makes approved external HTTP calls. It is currently configured on zero workstreams.</li></ol>
  <div class="cf">F90</div>
 </figcaption></figure></div><div id="v">
 <div id="vh"><b id="vt"></b><span id="vn"></span><button id="vx">Close</button></div>
 <div id="vb">
  <div id="vi"><img id="vimg" alt=""></div>
  <div id="vp"></div>
  <div id="vf"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move between screens &middot;
   <kbd>Esc</kbd> close</div>
 </div>
</div>

<script>
const DATA={"1": {"t": "Home screen", "a": "Open the application and remain on Home.", "o": ["Six featured agents, each tagged with a category (Research, Marketing, Workflow), a complexity level, and the output it produces — report, slides or data table.", "<b>View all agents</b> opens the full template picker.", "A free-text field accepts a request without selecting a template."], "f": ["F01", "F04"], "note": "<b>+ NEW</b> reloads Home. It does not open the template picker.", "g": "Entry"}, "2": {"t": "Template picker", "a": "Click <b>View all agents</b>.", "o": ["Approximately 20 prebuilt workstreams.", "<b>Start from Scratch</b> is the first card and accepts a plain-language description.", "The model dropdown at the lower left of the modal sets the model for the workstream. It lists only models the organisation has approved.", "Each template states the output it produces."], "f": ["F02", "F03", "F05"], "note": "", "g": "Entry"}, "3": {"t": "Data-availability check", "a": "Open the workstream <b>DEMO — Panda Express Monthly Report</b> and scroll to the top of the thread.", "o": ["The agent queried the available date range before answering. The dataset runs 2024-09-04 to 2026-06-22.", "It reported: &ldquo;July 2026 data is not yet available. Let me generate the June 2026 monthly report instead, which is the most recent complete month.&rdquo;", "Channel-level figures follow, returned from BigQuery."], "f": ["F10", "F11", "F15"], "note": "", "g": "Report generation"}, "4": {"t": "Tables and charts", "a": "Continue scrolling through the thread.", "o": ["Data tables support 10, 25 or 50 rows per page, with paging.", "Charts are rendered from configuration written by the agent, with value labels and axis formatting."], "f": ["F12", "F13"], "note": "", "g": "Report generation"}, "5": {"t": "Report outline gate", "a": "Scroll to the outline card at the foot of the thread.", "o": ["Each proposed finding is an editable text field.", "A checkbox on each row includes or excludes that finding.", "Up and down arrows set the order.", "<b>Approve &amp; Build</b> commits the outline and starts generation. No rendering occurs before it is pressed."], "f": ["F19", "F20", "F21", "F22", "F23"], "note": "The outline card exists only between run completion and approval. Approving removes it; producing another takes approximately six minutes.", "g": "Report generation"}, "6": {"t": "Generated report", "a": "Scroll to the report card.", "o": ["Header metadata: Comprehensive &middot; 10 Sections &middot; 2.9k Words &middot; Market Analysis.", "The branded header is applied at render time from <b>Organization &rarr; Design</b>, not stored in the report.", "Controls: edit, fullscreen, copy link, download."], "f": ["F24", "F25", "F26", "F28", "F29"], "note": "Fullscreen displays an empty frame for six to ten seconds before the content paints.", "g": "Report generation"}, "7": {"t": "Deck card", "a": "Scroll to the deck card.", "o": ["<b>12 slides &middot; Brand</b> states the slide count and the brand applied.", "The pencil icon opens the three-pane editor.", "Slides can be paged through on the card without opening the editor."], "f": ["F33", "F44", "F46", "F47"], "note": "Landscape / Portrait persists between sessions. Reverting requires a page reload.", "g": "Presentation generation"}, "8": {"t": "Deck outline gate", "a": "Request a deck. Scroll to the deck outline card at the foot of the thread.", "o": ["Every row carries a slide type: TITLE, STATS, CHART, COMPARISON, STATEMENT, GRID, CTA.", "<b>Deck default</b> is a per-row dropdown that overrides the theme for that slide only.", "Rows can be included, excluded and reordered, as on the report outline.", "<b>Approve &amp; Build</b> starts the render."], "f": ["F30", "F31", "F32"], "note": "As with the report outline, the card exists only while the deck is unapproved.", "g": "Presentation generation"}, "9": {"t": "Deck editor", "a": "Click the pencil icon on the deck card.", "o": ["Filmstrip on the left, slide canvas in the centre, format and outline panels on the right.", "Slide 3 carries a lock badge, indicating it is pinned and excluded from regeneration.", "Each outline row shows its slide type. The reference deck has 12 slides across seven types. <b>+ Add slide</b> lists all 20 available types.", "Each row has a padlock, a delete control and a drag handle.", "Orientation is set in the FORMAT panel."], "f": ["F33", "F34", "F35", "F36", "F39", "F40", "F42", "F43", "F45"], "note": "Portrait is sticky. A page reload is required to revert to Landscape.", "g": "Presentation generation"}, "10": {"t": "Format defaults", "a": "Scroll to the foot of the deck card.", "o": ["<b>Lock as default for all future presentations</b> promotes this deck&rsquo;s format to the standing default for subsequent runs.", "<b>Approve format</b> commits the layout."], "f": ["F36", "F37", "F38"], "note": "The checkbox is present only while the deck is unapproved.", "g": "Presentation generation"}, "11": {"t": "Themes and brand", "a": "Open <b>Organization &rarr; Design</b>, activate a different theme, then return to the deck.", "o": ["Five built-in themes.", "<b>Activate</b> re-skins output that has already been generated. The source data is not re-queried and the text is not regenerated.", "A custom extracted brand design is retained while a built-in theme is active. Deactivating restores it."], "f": ["F48", "F49", "F50", "F52", "F54"], "note": "", "g": "Presentation generation"}, "12": {"t": "Self-healing tab", "a": "Open <b>Workstreams &rarr; BigQuery Monthly Report &rarr; Self-Healing</b>.", "o": ["Workflow status: one validated, one needs review, one healthy.", "Configuration is checked separately from behaviour. A browser test runs while the tab is open.", "Three issues are reported as NO FIX FOUND &mdash; ESCALATION REQUIRED.", "Each unresolved issue offers Retry, Flag and Skip."], "f": ["F66", "F67", "F68", "F69", "F70", "F77", "F79", "F80", "F81"], "note": "", "g": "Validation"}, "13": {"t": "Browser sessions", "a": "Scroll down the Self-Healing tab to <b>Browser sessions</b>.", "o": ["Two sessions are listed. The badge reads RUNNING while a test is in progress.", "The test scenario is generated by the system and displayed: &ldquo;Can you generate the monthly report for our BigQuery analytics data?&rdquo;", "A video recording of each session plays inline or in a new tab.", "<b>View chat</b> opens the full transcript of the test run."], "f": ["F70", "F71", "F72", "F73"], "note": "The video shows a black frame until playback starts.", "g": "Validation"}, "14": {"t": "Applied fixes", "a": "Scroll past the escalated issues to <b>Auto-fixed on earlier runs</b>.", "o": ["Three issues were resolved automatically on earlier runs.", "Each carries a <b>Fixed by AI</b> badge.", "The applied change is shown in full: &ldquo;Strengthen base_instruction to mandate rendering the analytics-chart component after every chart generation.&rdquo;", "<b>View raw JSON</b> shows the complete change record."], "f": ["F74", "F75", "F76", "F78"], "note": "<b>2 fix attempts failed &mdash; view details</b> expands the escalation ladder. The chevron is the control; the text is not clickable.", "g": "Validation"}, "15": {"t": "Usage and performance", "a": "Open the <b>Usage &amp; Performance</b> tab.", "o": ["6.8M tokens across 25 sessions and 112 messages.", "57.2s average response latency; 0.0% error rate.", "$21.97 estimated cost, broken down by model."], "f": ["F87", "F88"], "note": "", "g": "Administration"}, "16": {"t": "Workstream access", "a": "Open <b>Share</b> on the workstream.", "o": ["&ldquo;Only people you share with can open this workstream.&rdquo;", "<b>With access: 1.</b>", "Access is granted individually through <b>Give access</b>."], "f": ["F57", "F58", "F59"], "note": "Distinct from <b>Builder &rarr; Access</b>, which controls who may build from the flow and is organisation-wide by default (9 of 9). The Share dialog controls read access to the conversation.", "g": "Administration"}, "17": {"t": "Members and roles", "a": "Open <b>Organization &rarr; Members</b>.", "o": ["Eight members in the organisation.", "Role is a per-person dropdown: Owner, Admin, Member.", "A <b>Pending</b> badge marks an invitation that has not been accepted.", "<b>Invite Member</b> adds a person by email address."], "f": ["F61", "F62", "F63", "F64", "F65"], "note": "", "g": "Administration"}, "18": {"t": "Model approval", "a": "Open <b>Organization &rarr; AI Models</b>.", "o": ["Four of seven models in the catalog are approved.", "Approved models populate the workstream model dropdown shown at step 2.", "Unapproved models are not selectable. A prompt requesting one is refused; no substitution is made."], "f": ["F86"], "note": "", "g": "Administration"}, "19": {"t": "Tool library", "a": "Open <b>Organization &rarr; Tools</b>.", "o": ["Twenty-three tools across seven categories.", "A tool added here applies to every workstream in the organisation.", "<b>api_connector_tool</b> makes approved external HTTP calls. It is currently configured on zero workstreams."], "f": ["F90"], "note": "", "g": "Administration"}};
const figs=[...document.querySelectorAll('figure')];
const v=document.getElementById('v'), vimg=document.getElementById('vimg'),
      vt=document.getElementById('vt'), vn=document.getElementById('vn'),
      vp=document.getElementById('vp');
let i=0, shown=figs;
function open_(k){
  i=k; const f=shown[i]; if(!f) return;
  const n=f.dataset.n, d=DATA[n];
  vimg.src=f.querySelector('img').src;
  vt.textContent=d.t;
  vn.textContent='Step 3.'+n+'  \u00b7  '+d.g+'  \u00b7  '+(i+1)+' of '+shown.length;
  vp.innerHTML='<div class="lbl">Action</div><div class="act">'+d.a+'</div>'
    +'<div class="lbl">Callouts</div><ol>'+d.o.map(o=>'<li>'+o+'</li>').join('')+'</ol>'
    +(d.note?'<div class="note"><b>Behaviour.</b> '+d.note+'</div>':'')
    +'<div class="ids">Features: '+d.f.join(' \u00b7 ')+'</div>';
  vp.scrollTop=0;
  v.classList.add('on');
}
function close_(){ v.classList.remove('on'); }
figs.forEach(f=>f.querySelector('img').addEventListener('click',()=>open_(shown.indexOf(f))));
document.getElementById('vx').onclick=close_;
v.addEventListener('click',e=>{ if(e.target===v||e.target.id==='vi'||e.target.id==='vb') close_(); });
addEventListener('keydown',e=>{
  if(!v.classList.contains('on')) return;
  if(e.key==='Escape') close_();
  if(e.key==='ArrowRight'){e.preventDefault();open_((i+1)%shown.length);}
  if(e.key==='ArrowLeft'){e.preventDefault();open_((i-1+shown.length)%shown.length);}
});
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const cut=b.dataset.f==='cut';
  figs.forEach(f=>f.classList.toggle('hide', cut && f.dataset.cut!=='1'));
  shown=figs.filter(f=>!f.classList.contains('hide'));
  document.querySelectorAll('.grid').forEach(g=>{
    const empty=!g.querySelector('figure:not(.hide)');
    g.classList.toggle('hide',empty);
    document.querySelector('h2[data-g="'+g.dataset.g+'"]').classList.toggle('hide',empty);
  });
});
</script></div></body></html>
